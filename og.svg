<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#0a1328"/>
      <stop offset="60%" stop-color="#05070b"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="globe" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="60%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="atm" cx="50%" cy="50%" r="58%">
      <stop offset="60%" stop-color="#00e7ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e7ff" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="50%" stop-color="#00e7ff"/>
      <stop offset="100%" stop-color="#6bf1a0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- scattered stars -->
  <g fill="#fff" opacity="0.7">
    <circle cx="80" cy="60" r="1"/>
    <circle cx="180" cy="120" r="1.5"/>
    <circle cx="260" cy="80" r="1"/>
    <circle cx="340" cy="40" r="1"/>
    <circle cx="420" cy="140" r="1.2"/>
    <circle cx="540" cy="80" r="1"/>
    <circle cx="660" cy="60" r="1.3"/>
    <circle cx="900" cy="100" r="1"/>
    <circle cx="1080" cy="160" r="1.5"/>
    <circle cx="1120" cy="50" r="1"/>
    <circle cx="60" cy="320" r="1.2"/>
    <circle cx="80" cy="560" r="1"/>
    <circle cx="1140" cy="480" r="1.3"/>
    <circle cx="1080" cy="580" r="1"/>
  </g>

  <!-- globe -->
  <g transform="translate(860 315)">
    <circle r="260" fill="url(#atm)"/>
    <circle r="220" fill="url(#globe)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- continents (abstract) -->
    <g fill="none" stroke="#7aa2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M-140 -40 q20 -50 80 -45 t60 30 q40 -20 80 0 t40 40 q-20 30 -60 20 t-80 -10 q-30 20 -70 10 t-50 -45z"/>
      <path d="M-80 90 q30 -20 80 -5 t100 -10 q10 30 -20 50 t-90 20 q-60 -10 -70 -55z"/>
      <path d="M80 -110 q20 -10 50 10 t10 40 q-30 20 -60 -10z"/>
    </g>
    <!-- equator -->
    <ellipse cx="0" cy="10" rx="220" ry="30" fill="none" stroke="rgba(0,231,255,0.25)" stroke-width="1" stroke-dasharray="2 6"/>
    <!-- city dots -->
    <g fill="#ffd36b">
      <circle cx="-60" cy="-20" r="3"/>
      <circle cx="-80" cy="30" r="2.4"/>
      <circle cx="20" cy="-40" r="2.8"/>
      <circle cx="60" cy="60" r="3"/>
      <circle cx="110" cy="-30" r="2.4"/>
      <circle cx="140" cy="20" r="3"/>
    </g>
    <!-- event label -->
    <g>
      <text x="30" y="-110" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#00e7ff" text-anchor="middle">🌋</text>
      <text x="30" y="-90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#fff" text-anchor="middle">volcano · Italy</text>
    </g>
  </g>

  <!-- text -->
  <g transform="translate(70 170)">
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" letter-spacing="12" fill="#5a6378">GAIA</text>
    <text y="130" font-family="ui-sans-serif, -apple-system, Inter, Segoe UI, sans-serif"
          font-size="90" font-weight="700" fill="url(#title)" letter-spacing="-2">A living Earth.</text>
    <text y="210" font-family="ui-sans-serif, -apple-system, Inter, Segoe UI, sans-serif"
          font-size="28" fill="#8a93a5">Shape the world with a single prompt.</text>
    <text y="260" font-family="ui-sans-serif, -apple-system, Inter, Segoe UI, sans-serif"
          font-size="22" fill="#5a6378">4,200 simulated lives · 16 cultures · 5,300 years of history · real-time day &amp; night</text>
  </g>

  <!-- prompt mockup -->
  <g transform="translate(70 470)">
    <rect x="0" y="0" width="640" height="64" rx="32"
          fill="rgba(10,14,20,0.78)" stroke="rgba(0,231,255,0.35)" stroke-width="1.5"/>
    <text x="30" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#00e7ff">⟁</text>
    <text x="60" y="40" font-family="ui-sans-serif, -apple-system, Inter, Segoe UI, sans-serif" font-size="20"
          fill="#e9edf3" font-style="italic">travel to 1969…</text>
    <circle cx="608" cy="32" r="19" fill="#00e7ff"/>
    <text x="608" y="39" font-family="ui-sans-serif, sans-serif" font-size="20" fill="#05070b" text-anchor="middle" font-weight="700">→</text>
  </g>
</svg>
